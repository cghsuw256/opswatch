name: defense-intranet

services:
  web:
    build:
      context: .
      dockerfile: docker/patched.Dockerfile
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - intranet_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    privileged: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "0.75"
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import Request, urlopen; urlopen(Request('http://127.0.0.1:8000/health/', headers={'Host': 'intranet.localhost'}), timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  intranet_data:
