{% extends "inventory/base.html" %}
{% block title %}수집 모듈 · 세온시스템{% endblock %}

    <p class="kicker">Modules</p>
    <h1>수집 모듈</h1>
  </div>
  <p class="muted">로그인된 운영 계정만 받을 수 있습니다.</p>

<section class="card module">
