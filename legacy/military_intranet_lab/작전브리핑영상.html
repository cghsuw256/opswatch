<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTINEL 침투 작전 — 시큐어코딩 브리핑</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:#05070d;
    font-family:"맑은 고딕","Malgun Gothic","Segoe UI",sans-serif;
    color:#dbe6f2; display:flex; align-items:center; justify-content:center;
    min-height:100%; padding:16px;
  }
  .player{ width:min(100%,960px); }

  /* 화면(스테이지) */
  .stage{
    position:relative; width:100%; aspect-ratio:16/9;
    background:#070b14; border:1px solid #1b2f4a; border-radius:10px;
    overflow:hidden; box-shadow:0 20px 60px #000a;
  }
  /* 공격/방어 톤 오버레이 */
  .stage::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 80% at 50% 0%, #ff2a2a14, transparent 60%);
    transition:background .6s; z-index:5;
  }
  .stage[data-tone="defense"]::after{
    background:radial-gradient(120% 80% at 50% 0%, #19d06b1f, transparent 60%);
  }
  .stage[data-tone="neutral"]::after{
    background:radial-gradient(120% 80% at 50% 0%, #3a7fcf1a, transparent 60%);
  }

  /* 상단 등급바 */
  .clsf{position:absolute;top:0;left:0;right:0;z-index:8;
    background:#7a1f1f;color:#ffdede;text-align:center;font-size:10px;
    letter-spacing:3px;padding:3px;font-weight:bold;}
  .stage[data-tone="defense"] .clsf{background:#1c5e39;color:#d6ffe6;}

  /* HUD */
  .hud{position:absolute;top:22px;left:16px;right:16px;z-index:8;
    display:flex;justify-content:space-between;font-size:11px;color:#6d87a3;
    letter-spacing:1px;}
  .hud .ph{color:#e08a85;font-weight:bold;}
  .stage[data-tone="defense"] .hud .ph{color:#6cd79a;}

  .inner{position:absolute;inset:0;padding:54px 48px 40px;z-index:6;
    display:flex;flex-direction:column;justify-content:center;}

  /* 애니메이션 유틸 */
  .rise{opacity:0;transform:translateY(10px);animation:rise .5s ease forwards;}
  @keyframes rise{to{opacity:1;transform:none;}}
  .pop{opacity:0;transform:scale(.9);animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards;}
  @keyframes pop{to{opacity:1;transform:none;}}
  .type{display:inline-block;overflow:hidden;white-space:nowrap;
    border-right:2px solid #6cf;width:0;
    animation:typing 1s steps(28) forwards, caret .7s step-end infinite;}
  @keyframes typing{to{width:100%;}}
  @keyframes caret{50%{border-color:transparent;}}
  .glitch{animation:glitch .35s steps(2) 3;}
  @keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-2px,1px)}
    50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px)}100%{transform:none}}
  .flash{animation:flash .6s ease;}
  @keyframes flash{0%{background:#ffffff22}100%{background:transparent}}

  /* 타이틀 */
  .title{font-size:40px;font-weight:900;letter-spacing:4px;color:#eaf1f8;
    text-align:center;text-shadow:0 0 18px #3a7fcf66;}
  .title .red{color:#ff5a52;}
  .subt{text-align:center;color:#8aa3bf;font-size:15px;margin-top:14px;letter-spacing:2px;}
  .crest{width:66px;height:72px;margin:0 auto 10px;display:block;}

  /* 브리핑 리스트 */
  .brief h3{font-size:20px;color:#eaf1f8;margin-bottom:18px;letter-spacing:1px;}
  .chain{display:flex;gap:10px;flex-wrap:wrap;}
  .chain .step{flex:1;min-width:120px;background:#0d1d31;border:1px solid #1f3b5c;
    border-radius:8px;padding:14px;}
  .chain .num{font-size:12px;color:#c9a24b;font-weight:bold;letter-spacing:1px;}
  .chain .nm{font-size:14px;color:#dbe6f2;margin-top:6px;font-weight:bold;}
  .chain .cwe{font-size:11px;color:#6d87a3;margin-top:4px;font-family:Consolas,monospace;}
  .chain .arrow{align-self:center;color:#44618a;font-size:20px;}

  /* 페이즈 배너 */
  .banner{text-align:center;}
  .banner .pn{font-size:16px;color:#c9a24b;letter-spacing:6px;font-weight:bold;}
  .banner .pt{font-size:34px;color:#eaf1f8;font-weight:900;margin-top:10px;letter-spacing:2px;}
  .banner .pd{font-size:14px;color:#8aa3bf;margin-top:12px;}
  .banner .line{width:0;height:2px;background:#ff5a52;margin:18px auto 0;
    animation:grow 1s ease forwards;}
  .stage[data-tone="defense"] .banner .line{background:#19d06b;}
  @keyframes grow{to{width:220px;}}

  /* 터미널 */
  .term{background:#04070d;border:1px solid #16304b;border-radius:8px;
    font-family:Consolas,"D2Coding",monospace;font-size:14px;overflow:hidden;}
  .term .tbar{background:#0d1d31;padding:7px 12px;font-size:11px;color:#6d87a3;
    border-bottom:1px solid #16304b;display:flex;gap:6px;align-items:center;}
  .term .dot{width:9px;height:9px;border-radius:50%;background:#44617f;}
  .term .body{padding:14px 16px;line-height:1.75;min-height:150px;}
  .term .l{white-space:pre-wrap;word-break:break-all;}
  .muted{color:#5f7e9c;} .cmd{color:#eaf1f8;} .ok{color:#5fe39a;} .bad{color:#ff6b63;}
  .warn{color:#e8b572;} .key{color:#e8c98a;}

  .lesson{background:#0b2a1a;border:1px solid #1f6b43;border-radius:10px;
    padding:20px 22px;}
  .lesson .lh{font-size:13px;color:#6cd79a;letter-spacing:2px;font-weight:bold;}
  .lesson .lt{font-size:19px;color:#eafff2;margin:8px 0 12px;font-weight:bold;}
  .lesson ul{list-style:none;} .lesson li{font-size:13.5px;color:#bfe9cf;
    padding:4px 0 4px 20px;position:relative;}
  .lesson li::before{content:"✓";position:absolute;left:0;color:#5fe39a;font-weight:bold;}

  .outro{text-align:center;}
  .outro .big{font-size:26px;color:#eaf1f8;font-weight:900;line-height:1.5;}
  .outro .sm{font-size:15px;color:#8aa3bf;margin-top:16px;}
  .defgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;text-align:left;}
  .defgrid div{background:#0d1d31;border:1px solid #1f3b5c;border-radius:7px;
    padding:11px 13px;font-size:12.5px;color:#cfe0f2;}
  .defgrid b{color:#6cd79a;}

  /* 컨트롤 */
  .bar{margin-top:12px;display:flex;align-items:center;gap:12px;}
  .prog{flex:1;height:5px;background:#12243a;border-radius:3px;overflow:hidden;}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3a7fcf,#6cd79a);}
  .ctrl{display:flex;gap:6px;}
  button{background:#12294a;color:#cfe0f2;border:1px solid #27476b;border-radius:6px;
    padding:8px 13px;font-size:13px;cursor:pointer;font-family:inherit;}
  button:hover{background:#1b3a63;}
  button.main{background:#2d6cb5;border-color:#2d6cb5;color:#fff;font-weight:bold;min-width:84px;}
  .scenelabel{font-size:12px;color:#6d87a3;min-width:120px;}
  .hint{text-align:center;font-size:11px;color:#45617f;margin-top:8px;}
</style>
</head>
<body>
<div class="player">
  <div class="stage" id="stage" data-tone="neutral">
    <div class="clsf">대외비 · 보안교육용 시뮬레이션 · 실제 시스템 아님</div>
    <div class="hud"><span class="ph" id="hudPhase">작전 브리핑</span><span id="hudCount">00 / 00</span></div>
    <div class="inner" id="inner"></div>
  </div>

  <div class="bar">
    <div class="prog"><i id="progBar"></i></div>
    <span class="scenelabel" id="sceneLabel"></span>
    <div class="ctrl">
      <button id="btnPrev">‹ 이전</button>
      <button class="main" id="btnPlay">⏸ 일시정지</button>
      <button id="btnNext">다음 ›</button>
      <button id="btnRestart">↻ 처음부터</button>
    </div>
  </div>
  <div class="hint">화면 클릭 또는 ← → 방향키로 이동 · 스페이스바로 재생/정지</div>
</div>

const stage=document.getElementById('stage');
const inner=document.getElementById('inner');
const progBar=document.getElementById('progBar');
const hudPhase=document.getElementById('hudPhase');
const hudCount=document.getElementById('hudCount');
const sceneLabel=document.getElementById('sceneLabel');
const btnPlay=document.getElementById('btnPlay');

let i=0, playing=true, raf=null, sceneStart=0, elapsedBefore=0, dur=0;

function render(){
  const s=S[i];
  inner.innerHTML=s.html;
  stage.setAttribute('data-tone', s.tone);
  hudPhase.textContent=s.phase;
  hudCount.textContent=String(i+1).padStart(2,'0')+" / "+String(S.length).padStart(2,'0');
  sceneLabel.textContent=s.label;
  dur=s.dur; elapsedBefore=0;
  progBar.style.width='0%';
  if(playing){ sceneStart=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(loop); }
}
function loop(now){
  if(!playing) return;
  const el=elapsedBefore+(now-sceneStart);
  const frac=Math.min(el/dur,1);
  progBar.style.width=(frac*100).toFixed(1)+'%';
  if(frac>=1){ next(); }
  else raf=requestAnimationFrame(loop);
}
function play(){ playing=true; btnPlay.textContent='⏸ 일시정지'; sceneStart=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(loop); }
function pause(){ playing=false; btnPlay.textContent='▶ 재생'; elapsedBefore+=performance.now()-sceneStart; cancelAnimationFrame(raf); }
function toggle(){ playing?pause():play(); }
function next(){ if(i<S.length-1){ i++; render(); } else { pause(); progBar.style.width='100%'; } }
function prev(){ if(i>0){ i--; render(); } }
function restart(){ i=0; playing=true; btnPlay.textContent='⏸ 일시정지'; render(); }

btnPlay.onclick=toggle;
document.getElementById('btnNext').onclick=()=>{ i<S.length-1?(i++,render()):null; };
document.getElementById('btnPrev').onclick=prev;
document.getElementById('btnRestart').onclick=restart;
stage.onclick=()=>{ i<S.length-1?(i++,render()):restart(); };
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){ next(); }
  else if(e.key==='ArrowLeft'){ prev(); }
  else if(e.key===' '){ e.preventDefault(); toggle(); }
});

render();
</script>
